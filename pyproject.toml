[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spygram"
version = "2.0.0"
description = "Download instagram content fasty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "curl-cffi>=0.7.0",
    "platformdirs>=4.0.0",
    "rookiepy>=0.5.0",
]

[project.scripts]
spygram = "spygram.cli:main"

[tool.setuptools.packages.find]
where = ["."]